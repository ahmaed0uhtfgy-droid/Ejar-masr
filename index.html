<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <!-- Start the TLS handshake for the database host while the JS bundle is still downloading. (Image hosts are not here: the images are lazy, and PageSpeed warns above 4 preconnects.) -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>إيجار مصر — شقق وغرف وفيلل ومحلات للإيجار في كل محافظات مصر</title>
    <meta name="description" content="ابحث عن شقق وغرف وفيلل ومحلات للإيجار في كل محافظات مصر وتواصل مع المالك أو السمسار مباشرة." />
    <meta name="theme-color" content="#0B1B3A" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts no longer block the first paint: media="print" lets the page render at once, /font-swap.js (same origin, so the CSP is unchanged) switches it on. -->
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet" media="print" data-font-swap />
    <noscript><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet" /></noscript>
    <script src="/font-swap.js" defer></script>
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var royal = localStorage.getItem('ejar:design') === 'royal';
          root.setAttribute('data-design', royal ? 'royal' : 'classic');
          var s = localStorage.getItem('theme');
          var dark = royal || (s ? s === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) root.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>هذا الموقع يحتاج تفعيل JavaScript لعرض الوحدات والبحث. تقدر تتصفح الوحدات حسب المحافظة: <a href="/rent/cairo">القاهرة</a> - <a href="/rent/giza">الجيزة</a> - <a href="/rent/alexandria">الإسكندرية</a> - <a href="/rent/dakahlia">الدقهلية</a>.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
