<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>إيجار مصر — وحدات للإيجار في كل محافظات مصر</title>
    <meta name="description" content="ابحث عن شقق وغرف وفيلل ومحلات للإيجار في كل محافظات مصر وتواصل مع المالك أو السمسار مباشرة." />
    <meta name="theme-color" content="#0F7C86" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var s = localStorage.getItem('theme');
          var dark = s ? s === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>هذا الموقع يحتاج تفعيل JavaScript لعرض الوحدات والبحث.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
